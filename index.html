<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咕噜财经 - 智能投资助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .header h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .header .subtitle { color: #666; font-size: 1rem; }
        .header .emoji { font-size: 3rem; margin-bottom: 15px; }
        
        /* App Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        .app-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .app-card .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .app-card .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .app-card .desc {
            font-size: 0.85rem;
            color: #888;
            line-height: 1.5;
        }
        .app-card .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-top: 10px;
        }
        
        /* Quick Links */
        .quick-links {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .quick-links h2 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quick-links h2 .icon { font-size: 1.5rem; }
        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: background 0.3s;
        }
        .link-item:hover { background: #e9ecef; }
        .link-item .icon {
            font-size: 1.5rem;
            margin-right: 15px;
        }
        .link-item .text { flex: 1; }
        .link-item .title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .link-item .desc {
            font-size: 0.85rem;
            color: #888;
        }
        .link-item .arrow {
            font-size: 1.2rem;
            color: #ccc;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.9);
            padding: 25px 20px;
            font-size: 0.9rem;
        }
        .footer a { color: white; text-decoration: underline; }
    </style>
</head>
