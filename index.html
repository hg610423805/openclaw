<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咕噜财经 - 智能投资助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 20px 40px 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .header h1 {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .header .subtitle { color: #666; font-size: 1rem; }
        .header .emoji { font-size: 3rem; margin-bottom: 15px; }
        
        /* Latest Report */
        .latest-report {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
        }
        .latest-report .badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .latest-report h2 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .latest-report .date {
            color: #888;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .latest-report .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
            transition: transform 0.3s;
        }
        .latest-report .btn:hover { transform: translateY(-2px); }
        
        /* App Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .app-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }
        .app-card .icon { font-size: 3rem; margin-bottom: 15px; }
        .app-card .title { font-size: 1.1rem; font-weight: 600; color: #333; margin-bottom: 8px; }
        .app-card .desc { font-size: 0.85rem; color: #888; line-height: 1.5; }
        .app-card .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-top: 10px;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.9);
            padding: 30px 20px 0 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="emoji">🐱</div>
            <h1>咕噜财经</h1>
            <div class="subtitle">智能投资助手 · 让投资更简单</div>
        </div>
        
        <!-- Latest Report -->
        <div class="latest-report">
            <span class="badge">🔥 最新</span>
            <h2>财经日报</h2>
            <div class="date">2026 年 3 月 21 日</div>
            <a href="daily-report-2026-03-21.html" class="btn">立即查看</a>
        </div>
        
        <!-- App Grid -->
        <div class="app-grid">
            <a href="report-list.html?type=daily" class="app-card">
                <div class="icon">📰</div>
                <div class="title">财经日报</div>
                <div class="desc">每日热点新闻 + 投资策略</div>
                <div class="badge">每日 8:00 更新</div>
            </a>
            
            <a href="report-list.html?type=trading" class="app-card">
                <div class="icon">📊</div>
                <div class="title">交易回测</div>
                <div class="desc">期货交易数据分析报告</div>
                <div class="badge">实时更新</div>
            </a>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p>🤖 由 咕噜 自动生成</p>
            <p>数据来源：东方财富 · 财联社 · 同花顺 · 金十数据</p>
            <p style="margin-top: 15px; font-size: 0.8rem; opacity: 0.7;">
                ⚠️ 投资有风险 · 决策需谨慎
            </p>
        </div>
    </div>
</body>
</html>
