<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报告列表 - 咕噜财经</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 20px 40px 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .header h1 {
            color: #333;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .back {
            color: #667eea;
            text-decoration: none;
            font-size: 1.2rem;
        }
        
        /* Report List */
        .report-list {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .report-item {
            display: flex;
            align-items: center;
            padding: 18px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 12px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
            border-left: 4px solid transparent;
        }
        .report-item:hover {
            background: #e9ecef;
            border-left-color: #667eea;
            transform: translateX(5px);
        }
        .report-item:last-child { margin-bottom: 0; }
        .report-item .date {
            width: 110px;
            font-weight: 600;
            color: #667eea;
            font-size: 0.95rem;
        }
        .report-item .info { flex: 1; }
        .report-item .title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .report-item .desc {
            font-size: 0.85rem;
            color: #888;
        }
        .report-item .arrow {
            color: #ccc;
            font-size: 1.2rem;
        }
        .report-item .badge {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 10px;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.9);
            padding: 30px 20px 0 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <a href="https://htmlpreview.github.io/?https://github.com/hg610423805/openclaw/blob/main/index.html" class="back">←</a>
                <span id="pageTitle">报告列表</span>
            </h1>
        </div>
        
        <!-- Report List -->
        <div class="report-list" id="reportList">
            <!-- 将由 JS 动态生成 -->
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p>🤖 咕噜财经</p>
        </div>
    </div>
    
    <script>
        // 获取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        let type = urlParams.get('type');
        if (!type) {
            // 从 URL 路径推断类型
            const url = window.location.href;
            if (url.includes('type=trading')) type = 'trading';
            else type = 'daily';
        }
        
        // 设置页面标题
        const titles = {
            'daily': '📰 财经日报列表',
            'trading': '📊 交易回测报告'
        };
        document.getElementById('pageTitle').textContent = titles[type] || '报告列表';
        
        // 生成报告列表数据
        function generateReports() {
            const today = new Date('2026-03-21'); // 当前日期
            
            if (type === 'daily') {
                // 财经日报 - 只生成 3 月 21 日及以后的报告
                const reports = [];
                const startDate = new Date('2026-03-21');
                
                for (let i = 0; i < 30; i++) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    
                    // 只显示 3 月 21 日及以后的报告
                    if (date < startDate) continue;
                    
                    const dateStr = date.toISOString().split('T')[0];
                    const isToday = i === 0;
                    
                    reports.push({
                        date: dateStr,
                        title: isToday ? '今日财经日报' : `财经日报`,
                        desc: '每日热点 + 策略 + 标的推荐',
                        badge: isToday ? '最新' : null,
                        link: `https://htmlpreview.github.io/?https://github.com/hg610423805/openclaw/blob/main/daily-report-${dateStr}.html`
                    });
                }
                
                return reports;
            } else {
                // 交易回测报告
                return [
                    {
                        date: '2026-03-20',
                        title: '期货交易回测分析',
                        desc: '硅铁/尿素/鸡蛋/豆粕 - 221 笔交易 | +36,620 元',
                        badge: '最新',
                        link: 'https://htmlpreview.github.io/?https://github.com/hg610423805/openclaw/blob/main/trading_report_full.html'
                    },
                    {
                        date: '2026-03-15',
                        title: '期货交易回测分析',
                        desc: '历史回测报告',
                        badge: null,
                        link: 'https://htmlpreview.github.io/?https://github.com/hg610423805/openclaw/blob/main/trading_report_full.html'
                    }
                ];
            }
        }
        
        // 渲染报告列表
        function renderReports() {
            const listEl = document.getElementById('reportList');
            const reports = generateReports();
            
            if (reports.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; padding: 40px; color: #888;">暂无报告</div>';
                return;
            }
            
            listEl.innerHTML = reports.map(report => `
                <a href="${report.link}" class="report-item">
                    <div class="date">${report.date}</div>
                    <div class="info">
                        <div class="title">${report.title}</div>
                        <div class="desc">${report.desc}</div>
                    </div>
                    ${report.badge ? `<span class="badge">${report.badge}</span>` : ''}
                    <div class="arrow">→</div>
                </a>
            `).join('');
        }
        
        renderReports();
    </script>
</body>
</html>
