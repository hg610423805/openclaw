<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报告列表 - 咕噜财经</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 20px 100px 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .header h1 {
            color: #333;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .back {
            color: #667eea;
            text-decoration: none;
            font-size: 1.2rem;
        }
        
        /* Report List */
        .report-list {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .report-item {
            display: flex;
            align-items: center;
            padding: 18px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 12px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
            border-left: 4px solid transparent;
        }
        .report-item:hover {
            background: #e9ecef;
            border-left-color: #667eea;
            transform: translateX(5px);
        }
        .report-item:last-child { margin-bottom: 0; }
        .report-item .date {
            width: 100px;
            font-weight: 600;
            color: #667eea;
            font-size: 0.95rem;
        }
        .report-item .info { flex: 1; }
        .report-item .title {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .report-item .desc {
            font-size: 0.85rem;
            color: #888;
        }
        .report-item .arrow {
            color: #ccc;
            font-size: 1.2rem;
        }
        .report-item .badge {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            margin-left: 10px;
        }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 10px 20px;
            display: flex;
            gap: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            padding: 8px 15px;
            border-radius: 12px;
            transition: background 0.3s;
        }
        .nav-item:hover { background: #f0f0f0; }
        .nav-item .icon { font-size: 1.5rem; margin-bottom: 4px; }
        .nav-item .text { font-size: 0.8rem; font-weight: 500; }
        .nav-item.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <a href="index.html" class="back">←</a>
                <span id="pageTitle">报告列表</span>
            </h1>
        </div>
        
        <!-- Report List -->
        <div class="report-list" id="reportList">
            <!-- 将由 JS 动态生成 -->
        </div>
    </div>
    
    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="icon">🏠</span>
            <span class="text">首页</span>
        </a>
        <a href="report-list.html?type=daily" class="nav-item active">
            <span class="icon">📰</span>
            <span class="text">日报</span>
        </a>
        <a href="report-list.html?type=trading" class="nav-item">
            <span class="icon">📊</span>
            <span class="text">回测</span>
        </a>
        <a href="#" class="nav-item">
            <span class="icon">⚙️</span>
            <span class="text">设置</span>
        </a>
    </nav>
    
    <script>
        // 获取 URL 参数
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type') || 'daily';
        
        // 设置页面标题
        const titles = {
            'daily': '📰 财经日报列表',
            'trading': '📊 交易回测报告'
        };
        document.getElementById('pageTitle').textContent = titles[type] || '报告列表';
        
        // 生成报告列表数据
        function generateReports() {
            const reports = [];
            const today = new Date();
            
            if (type === 'daily') {
                // 财经日报 - 最近 30 天
                for (let i = 0; i < 30; i++) {
                    const date = new Date(today);
                    date.setDate(date.getDate() - i);
                    const dateStr = date.toISOString().split('T')[0];
                    const isToday = i === 0;
                    const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                    
                    reports.push({
                        date: dateStr,
                        title: isToday ? '今日财经日报' : `财经日报 (${dateStr})`,
                        desc: isWeekend ? '休市日' : '每日热点 + 策略 + 标的推荐',
                        badge: isToday ? '最新' : null,
                        link: `daily-report-${dateStr}.html`
                    });
                }
            } else {
                // 交易回测报告
                reports.push({
                    date: '2026-03-20',
                    title: '期货交易回测分析',
                    desc: '硅铁/尿素/鸡蛋/豆粕 - 221 笔交易',
                    badge: '最新',
                    link: 'trading_report_full.html'
                });
            }
            
            return reports;
        }
        
        // 渲染报告列表
        function renderReports() {
            const listEl = document.getElementById('reportList');
            const reports = generateReports();
            
            listEl.innerHTML = reports.map(report => `
                <a href="${report.link}" class="report-item">
                    <div class="date">${report.date}</div>
                    <div class="info">
                        <div class="title">${report.title}</div>
                        <div class="desc">${report.desc}</div>
                    </div>
                    ${report.badge ? `<span class="badge">${report.badge}</span>` : ''}
                    <div class="arrow">→</div>
                </a>
            `).join('');
        }
        
        renderReports();
    </script>
</body>
</html>
